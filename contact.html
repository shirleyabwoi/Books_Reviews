<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <header>
        <div class="headerText">
            <i class="fa-solid fa-book-open-reader fa-xl" style="color: rgb(138, 103, 51)" id="bloggerIcon"></i>
            <p id="headertext">Shirley<span id="nameText">Abwoi</span></p>
            <i class="fa-regular fa-copyright fa-2xs" style="color: black;" id="copyright"></i>
        </div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#news">Blog</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#about">About</a></li>
        </ul>
        <div class="socialHandles">
            <i class="fa-brands fa-facebook-f fa-2xs" style="color: rgb(138, 103, 51)" id="icon"></i>
            <i class="fa-brands fa-instagram fa-2xs" style="color: rgb(138, 103, 51)" id="icon"></i>
            <i class="fa-brands fa-pinterest-p fa-2xs" style="color: rgb(138, 103, 51)" id="icon"></i>
            <i class="fa-brands fa-linkedin-in fa-2xs" style="color: rgb(138, 103, 51)" id="icon"></i>
            <button type="button" id="newsletterButton">SUBSCRIBE</button>
        </div>
    </header>
    <div class="contactInformation">
        <h1>Contact Information</h1>
        <p>Having any difficulties using our website?</p>
        <p>Any proposals and ideas or ideas for improvement?</p>
        <h2>Get in touch</h2>
       <div class="contactDetails">
        <i class="fa-solid fa-envelope fa-2xl" style="color: blue;" id="contactIcon"></i>
        <p>Contact us via email at<br><a href="mailto:shirleyabwoi@gmail.com" id="contactLink">shirleyabwoi@gmail.com</a></p>
       </div>
        <h2>Or</h2>
        <div class="contactDetails">
            <i class="fa-solid fa-phone fa-2xl" style="color: blue;" id="contactIcon"></i>
            <p><a href="tel:+254717842668" id="contactLink">+254717842668</a></p>
        </div>
    </div>
    <form>
        <div>
          <h2>Subscribe to our Blogs</h2>
        </div>
        <div class="subscribeContainer">
          <input type="text" placeholder="Name" name="name" required>
          <input type="email" placeholder="Email address" name="mail" required>
          <label>
            <input type="checkbox" checked="checked" name="subscribe"> Daily Blogs
          </label><br>
          <label>
            <input type="checkbox" checked="checked" name="subscribe"> Weekly Blogs
          </label>
        </div>
      
        <div class="container">
          <input type="submit" value="Subscribe">
        </div>
      </form>
</body>
</html>
